
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator | Smartverktyg</title>
  <link rel="stylesheet" href="../styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="tool-page">
    <a class="back-button" href="../index.html">← Till startsidan</a>

      <input id="calc-display" type="text" placeholder="Skriv ett uttryck, t.ex. 12*5">
      <button id="calc-button">Räkna ut</button>
      <p id="calc-result" aria-live="polite"></p>
    </div>
  </main>
  <script src="calculator.js"></script>
</body>
</html>
