
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konto | Smartverktyg</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .account-box {
      max-width: 420px;
      margin: 50px auto;
      padding: 24px;
      border-radius: 16px;
      background: var(--card, #20232c);
    }
    .account-box input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
    }
    .account-box button {
      padding: 12px;
      margin: 5px 0;
      width: 100%;
      cursor: pointer;
    }
    #message {
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="account-box">
    <h1>Mitt konto</h1>
    <p>Skapa ett konto eller logga in på Smartverktyg.</p>

    <form id="account-form">
      <label for="email">E-post</label>
      <input id="email" type="email"
        autocomplete="email" required>

      <label for="password">Lösenord</label>
      <input id="password" type="password"
        autocomplete="current-password"
        minlength="6" required>

      <button type="submit" id="login">Logga in</button>
      <button type="button" id="signup">Skapa konto</button>
    </form>

    <button type="button" id="logout" hidden>
      Logga ut
    </button>

    <p id="message" role="status" aria-live="polite"></p>
    <p id="user-info"></p>

    <a href="index.html">← Tillbaka till startsidan</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="konto.js"></script>
</body>
</html>
